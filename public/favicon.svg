<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2185fc"/>
      <stop offset="100%" stop-color="#0e62d9"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f9"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002d72" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#blueGrad)" filter="url(#drop)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Open Notebook Body Left Page -->
  <path d="M14 20C14 18.3431 15.3431 17 17 17H30V45C25 45 19 46 14 48V20Z" fill="url(#pageGrad)"/>
  
  <!-- Open Notebook Body Right Page -->
  <path d="M50 20C50 18.3431 48.6569 17 47 17H34V45C39 45 45 46 50 48V20Z" fill="url(#pageGrad)"/>

  <!-- Spine Center Shadow -->
  <line x1="32" y1="17" x2="32" y2="45" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Page Lines -->
  <line x1="18" y1="23" x2="26" y2="23" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="18" y1="28" x2="26" y2="28" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="18" y1="33" x2="24" y2="33" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Right Page Lines -->
  <line x1="38" y1="23" x2="46" y2="23" stroke="#1877f2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="38" y1="28" x2="46" y2="28" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="38" y1="33" x2="44" y2="33" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Bookmark Ribbon Ribbon (Cyan / Amber Accent) -->
  <path d="M30 15H34V30L32 28L30 30V15Z" fill="#ffbd42"/>
</svg>
